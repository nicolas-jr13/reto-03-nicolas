<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro de proveedor</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17211e;
      --muted: #5c6b66;
      --line: #d5e0da;
      --paper: #f3f6f4;
      --card: #fff;
      --accent: #0d6b4c;
      --confirm: #8a4b08;
      --confirm-bg: #fff6ea;
      --confirm-line: #efd3b0;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; font: 16px/1.5 "Segoe UI", sans-serif; color: var(--ink); background: var(--paper); }
    button, textarea { font: inherit; color: inherit; }
    button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .app { display: grid; grid-template-columns: 320px minmax(0, 1fr); height: 100%; }
    aside { padding: 28px 20px; border-right: 1px solid var(--line); background: #f7faf8; overflow: auto; }
    .eyebrow { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
    h1 { margin: 6px 0 0; font-size: 28px; letter-spacing: -0.03em; line-height: 1.15; }
    .lede, .status { color: var(--muted); }
    .lede { margin: 10px 0 0; font-size: 14px; }
    .casos { display: grid; gap: 8px; margin-top: 22px; }
    .casos h2, .composer label { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
    .caso, .ghost, .primary { border-radius: 999px; cursor: pointer; }
    .caso, .ghost { text-align: left; border: 1px solid var(--line); background: var(--card); }
    .caso { padding: 8px 12px; }
    .ghost { width: 100%; margin-top: 16px; padding: 8px 14px; }
    .primary { border: 0; background: var(--accent); color: #fff; padding: 10px 16px; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .status { margin: 14px 0 0; font-size: 13px; }
    main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    #log { flex: 1; overflow: auto; padding: 28px; display: flex; flex-direction: column; gap: 14px; }
    .empty { margin: auto; max-width: 520px; text-align: center; color: var(--muted); }
    .empty h2 { margin: 0 0 8px; color: var(--ink); font-size: 22px; }
    .bubble { max-width: 760px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
    .bubble.user { margin-left: auto; background: #e5f6ee; border-color: #c9e6d8; }
    .bubble.confirmacion { background: var(--confirm-bg); border-color: var(--confirm-line); }
    .meta { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
    .who { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
    .badge { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--confirm); background: #f3e2cc; border-radius: 999px; padding: 2px 8px; }
    .content p { margin: 0 0 10px; }
    .content p:last-child { margin-bottom: 0; }
    .content ul { margin: 0 0 10px; padding-left: 1.2rem; }
    .tool { margin-top: 10px; border-left: 3px solid var(--accent); background: #f3faf7; border-radius: 8px; padding: 8px 10px; }
    .tool b { font-family: Consolas, monospace; }
    .tool pre { white-space: pre-wrap; margin: 6px 0 0; font-size: 12.5px; }
    .composer { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; padding: 12px 28px 20px; }
    .composer label { grid-column: 1 / -1; }
    textarea { width: 100%; min-height: 72px; resize: vertical; border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; background: #fff; }
    .thinking { margin: 0; color: var(--muted); font-style: italic; }
    .confirmar { align-self: center; margin: 0 28px 8px; }
    @media (max-width: 860px) {
      .app { display: block; height: auto; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); }
      #log { overflow: visible; }
      .bubble.user { margin-left: 0; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <p class="eyebrow">Reto 01</p>
      <h1>Registro de proveedor</h1>
      <p class="lede">El agente llena el formulario desde el maestro y deja el paquete listo. No firma ni envía.</p>
      <div class="casos">
        <h2>Casos</h2>
        <button class="caso" type="button" data-caso="co-industrias-delta">co-industrias-delta</button>
        <button class="caso" type="button" data-caso="ec-corp-andina">ec-corp-andina</button>
        <button class="caso" type="button" data-caso="hn-agroexport-sula">hn-agroexport-sula</button>
        <button class="caso" type="button" data-caso="pa-logistica-istmo">pa-logistica-istmo</button>
      </div>
      <button class="ghost" type="button" id="nueva">Nueva sesión</button>
      <p class="status" id="health">Consultando el servidor…</p>
    </aside>
    <main>
      <div id="log" aria-live="polite">
        <div class="empty" id="empty">
          <h2>Elige un caso</h2>
          <p>Pide procesar una solicitud. Verás cada herramienta y, si hace falta, la confirmación humana.</p>
        </div>
      </div>
      <form class="composer" id="form">
        <label for="mensaje">Mensaje para la analista</label>
        <textarea id="mensaje" name="mensaje" placeholder="Procesa el caso…" required></textarea>
        <button class="primary" id="enviar" type="submit">Enviar</button>
      </form>
    </main>
  </div>
  <script>
    const log = document.querySelector("#log")
    const form = document.querySelector("#form")
    const mensaje = document.querySelector("#mensaje")
    const enviar = document.querySelector("#enviar")
    const health = document.querySelector("#health")
    let sessionId = localStorage.getItem("proveedor-session") || crypto.randomUUID()
    localStorage.setItem("proveedor-session", sessionId)

    const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]))
    const inline = (value) => escapeHtml(value).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")

    function renderText(value) {
      const lines = String(value || "").replace(/\r\n/g, "\n").split("\n")
      let html = ""
      let i = 0
      while (i < lines.length) {
        if (!lines[i].trim()) { i += 1; continue }
        if (/^\s*[-*]\s+/.test(lines[i])) {
          const items = []
          while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
            items.push(lines[i].replace(/^\s*[-*]\s+/, ""))
            i += 1
          }
          html += `<ul>${items.map((item) => `<li>${inline(item)}</li>`).join("")}</ul>`
          continue
        }
        const paragraph = []
        while (i < lines.length && lines[i].trim() && !/^\s*[-*]\s+/.test(lines[i])) {
          paragraph.push(lines[i])
          i += 1
        }
        html += `<p>${paragraph.map(inline).join("<br>")}</p>`
      }
      return html
    }

    function addBubble(role, text, tools = [], needsConfirmation = false) {
      document.querySelector("#empty")?.remove()
      const node = document.createElement("article")
      node.className = `bubble ${role}${needsConfirmation ? " confirmacion" : ""}`
      const badge = needsConfirmation ? `<span class="badge">Confirmación humana</span>` : ""
      const toolsHtml = tools.map((tool) => {
        const args = typeof tool.arguments === "string" ? tool.arguments : JSON.stringify(tool.arguments ?? {}, null, 2)
        return `<div class="tool"><b>${escapeHtml(tool.name)}</b><div>${escapeHtml(tool.summary || "")}</div><details><summary>Argumentos y resultado</summary><pre>${escapeHtml(args)}</pre><pre>${escapeHtml(tool.result || "")}</pre></details></div>`
      }).join("")
      node.innerHTML = `<div class="meta"><div class="who">${role === "user" ? "Analista" : "Agente"}</div>${badge}</div><div class="content">${renderText(text)}</div>${toolsHtml}`
      log.append(node)
      node.scrollIntoView({ block: "nearest" })
    }

    function setBusy(busy) {
      enviar.disabled = busy
      mensaje.disabled = busy
      document.querySelectorAll(".caso, #nueva").forEach((node) => { node.disabled = busy })
      const note = document.querySelector(".thinking")
      if (busy && !note) {
        document.querySelector("#empty")?.remove()
        const thinking = document.createElement("p")
        thinking.className = "thinking"
        thinking.textContent = "Pensando…"
        log.append(thinking)
      }
      if (!busy && note) note.remove()
    }

    async function send(text) {
      addBubble("user", text)
      mensaje.value = ""
      setBusy(true)
      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sessionId, message: text, respaldo: leerRespaldo() }),
        })
        const raw = await response.text()
        let data
        try {
          data = JSON.parse(raw)
        } catch {
          throw new Error("Vercel cortó la función antes de que el agente terminara. Vuelve a enviar el mismo mensaje.")
        }
        if (!response.ok) throw new Error(data.error || "No pude enviar el mensaje.")
        guardarRespaldo(data.respaldo)
        addBubble("assistant", data.reply || "", data.toolCalls || [], Boolean(data.needsConfirmation))
        if (data.needsConfirmation && /responde «envía»|envío simulado/i.test(data.reply || "")) mostrarConfirmacion()
      } catch (error) {
        addBubble("assistant", error instanceof Error ? error.message : "Error de red. La sesión sigue activa.")
      } finally {
        setBusy(false)
        mensaje.focus()
      }
    }

    function mostrarConfirmacion() {
      if (document.querySelector(".confirmar")) return
      const button = document.createElement("button")
      button.className = "primary confirmar"
      button.type = "button"
      button.textContent = "Confirmar envío simulado"
      button.addEventListener("click", () => {
        button.remove()
        send("envía")
      })
      form.before(button)
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault()
      const text = mensaje.value.trim()
      if (text) send(text)
    })

    document.querySelectorAll(".caso").forEach((button) => {
      button.addEventListener("click", () => {
        const caso = button.dataset.caso
        mensaje.value = `Procesa el caso "${caso}". Dime qué campos quedaron llenos, cuáles faltan, si el paquete está listo para firma y qué soportes debo actualizar. No envíes nada todavía.`
        mensaje.focus()
      })
    })

    function claveRespaldo() {
      return `proveedor-respaldo:${sessionId}`
    }

    function guardarRespaldo(respaldo) {
      if (!respaldo) return
      try { localStorage.setItem(claveRespaldo(), JSON.stringify(respaldo)) } catch { /* el historial del servidor sigue en este turno */ }
    }

    function leerRespaldo() {
      try { return JSON.parse(localStorage.getItem(claveRespaldo()) || "null") } catch { return null }
    }

    function pintarHistorial(data) {
      let pending = []
      for (const message of data.messages || []) {
        if (message.role === "system") continue
        if (message.role === "user") addBubble("user", message.content)
        if (message.role === "assistant" && message.toolCalls?.length) {
          pending = message.toolCalls.map((call) => ({ name: call.name, arguments: call.arguments, summary: "Llamada registrada en la sesión.", result: "" }))
        } else if (message.role === "tool") {
          const slot = pending.find((tool) => !tool.result)
          if (slot) slot.result = message.content
        } else if (message.role === "assistant") {
          addBubble("assistant", message.content, pending, data.estado === "esperando_confirmacion")
          pending = []
        }
      }
    }

    document.querySelector("#nueva").addEventListener("click", () => {
      localStorage.removeItem(claveRespaldo())
      sessionId = crypto.randomUUID()
      localStorage.setItem("proveedor-session", sessionId)
      document.querySelector(".confirmar")?.remove()
      log.replaceChildren()
      const empty = document.createElement("div")
      empty.className = "empty"
      empty.id = "empty"
      empty.innerHTML = "<h2>Sesión nueva</h2><p>Elige un caso y pide procesarlo.</p>"
      log.append(empty)
    })

    fetch("/api/health").then((response) => response.json()).then((data) => {
      health.textContent = data.ok ? `Servidor activo. Modelo: ${data.provider} / ${data.model}.` : "El servidor no respondió."
    }).catch(() => { health.textContent = "No pude leer /api/health." })

    fetch(`/api/sessions/${sessionId}`).then((response) => response.json()).then((data) => {
      const delServidor = (data.messages || []).some((message) => message.role === "user")
      if (delServidor) pintarHistorial(data)
      else {
        const local = leerRespaldo()
        if (local) pintarHistorial(local)
      }
    }).catch(() => {
      const local = leerRespaldo()
      if (local) pintarHistorial(local)
    })
  </script>
</body>
</html>
