<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Órdenes de compra</title>
  <style>
    :root { color-scheme: light; --ink: #1c2430; --muted: #5c6b7a; --line: #d5e0dc; --paper: #f4f7f6; --card: #fff; --accent: #0f6b4c; --accent-ink: #fff; --warn: #8a4b08; --warn-bg: #fff4e5; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 "Segoe UI", sans-serif; color: var(--ink); background: var(--paper); }
    header, main { width: min(880px, calc(100% - 32px)); margin: 0 auto; }
    header { padding: 28px 0 8px; }
    h1 { margin: 0; font-size: 28px; letter-spacing: -0.03em; }
    header p { margin: 6px 0 0; color: var(--muted); }
    .status { margin-top: 10px; font-size: 14px; color: var(--muted); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
    button, textarea { font: inherit; }
    .chip, .primary, .ghost { border-radius: 999px; border: 1px solid var(--line); background: var(--card); padding: 8px 14px; cursor: pointer; }
    .primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
    .chip:hover, .ghost:hover, .primary:hover { filter: brightness(0.97); }
    button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #log { display: grid; gap: 12px; padding-bottom: 18px; }
    .bubble { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
    .bubble.user { background: #e7f5ef; }
    .who { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
    .tool { margin-top: 8px; border-left: 3px solid var(--accent); padding: 6px 10px; background: #f3faf7; border-radius: 8px; }
    .tool b { font-family: Consolas, monospace; }
    .tool pre { white-space: pre-wrap; margin: 6px 0 0; font-size: 13px; }
    .content p { margin: 0 0 10px; }
    .content p:last-child { margin-bottom: 0; }
    .content ul { margin: 0 0 10px; padding-left: 1.2rem; }
    .content li { margin: 4px 0; }
    .banner { border: 1px solid #efd3a8; background: var(--warn-bg); color: var(--warn); border-radius: 16px; padding: 12px 14px; }
    form { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; position: sticky; bottom: 0; background: var(--paper); padding: 12px 0 20px; }
    form label { grid-column: 1 / -1; }
    textarea { resize: vertical; min-height: 64px; border-radius: 16px; border: 1px solid var(--line); padding: 12px; }
    .thinking { color: var(--muted); font-style: italic; }
    .table-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 14px; }
    th, td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; white-space: normal; overflow-wrap: anywhere; }
    th { background: #e7f5ef; }
  </style>
</head>
<body>
  <header>
    <h1>Órdenes de compra</h1>
    <p>La analista pide procesar un caso. El agente lee, valida y solo crea la OC si no hay bloqueos ni confirmaciones pendientes.</p>
    <div class="status" id="health">Consultando el servidor…</div>
    <div class="chips">
      <button class="chip" type="button" data-prompt="Procesa la solicitud &quot;sol-001&quot;.">sol-001</button>
      <button class="chip" type="button" data-prompt="Procesa la solicitud &quot;sol-004&quot;. Muéstrame la OC como quedaría en SAP, qué validaciones pasó y cuáles no, y no la crees hasta que yo lo confirme.">sol-004</button>
      <button class="chip" type="button" data-prompt="Procesa la solicitud &quot;sol-005&quot;.">sol-005</button>
      <button class="ghost" type="button" id="nueva">Nueva sesión</button>
    </div>
  </header>
  <main>
    <div id="log" aria-live="polite"></div>
    <div id="banner" class="banner" hidden>
      <strong>Hace falta confirmación.</strong>
      <p>El agente no va a crear la orden hasta que usted lo acepte.</p>
      <button class="primary" type="button" id="confirmar">Confirmar creación</button>
    </div>
    <form id="form">
      <label for="mensaje" class="who">Mensaje</label>
      <textarea id="mensaje" name="mensaje" placeholder="Procesa la solicitud sol-001" required></textarea>
      <button class="primary" id="enviar" type="submit">Enviar</button>
    </form>
  </main>
  <script>
    const log = document.querySelector("#log")
    const banner = document.querySelector("#banner")
    const form = document.querySelector("#form")
    const mensaje = document.querySelector("#mensaje")
    const enviar = document.querySelector("#enviar")
    const health = document.querySelector("#health")
    let sessionId = localStorage.getItem("oc-session") || crypto.randomUUID()
    localStorage.setItem("oc-session", sessionId)

    const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]))
    const inline = (value) => escapeHtml(value).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    const esTabla = (lines, index) => lines[index].includes("|") && lines[index + 1] && /^\s*\|?\s*:?-{3,}/.test(lines[index + 1])
    const esLista = (line) => /^\s*[-*]\s+/.test(line)

    function renderText(value) {
      const lines = String(value).replace(/\r\n/g, "\n").split("\n")
      let html = ""
      let i = 0
      while (i < lines.length) {
        if (!lines[i].trim()) { i += 1; continue }
        if (esTabla(lines, i)) {
          const rows = []
          while (i < lines.length && lines[i].includes("|")) {
            if (!/^\s*\|?\s*:?-{3,}/.test(lines[i])) rows.push(lines[i].split("|").map((cell) => cell.trim()).filter((cell, index, all) => cell !== "" || (index > 0 && index < all.length - 1)))
            i += 1
          }
          html += `<div class="table-wrap"><table>${rows.map((row, index) => `<tr>${row.map((cell) => index === 0 ? `<th>${inline(cell)}</th>` : `<td>${inline(cell)}</td>`).join("")}</tr>`).join("")}</table></div>`
          continue
        }
        if (esLista(lines[i])) {
          const items = []
          while (i < lines.length && esLista(lines[i])) {
            items.push(lines[i].replace(/^\s*[-*]\s+/, ""))
            i += 1
          }
          html += `<ul>${items.map((item) => `<li>${inline(item)}</li>`).join("")}</ul>`
          continue
        }
        const paragraph = []
        while (i < lines.length && lines[i].trim() && !esTabla(lines, i) && !esLista(lines[i])) {
          paragraph.push(lines[i])
          i += 1
        }
        html += `<p>${paragraph.map(inline).join("<br>")}</p>`
      }
      return html
    }

    function addBubble(role, text, tools = []) {
      const node = document.createElement("article")
      node.className = `bubble ${role}`
      const who = role === "user" ? "Analista" : "Agente"
      const toolsHtml = tools.map((tool) => `<div class="tool"><b>${escapeHtml(tool.name)}</b><div>${escapeHtml(tool.summary || "")}</div><details><summary>Argumentos y resultado</summary><pre>${escapeHtml(JSON.stringify(tool.arguments, null, 2) || "")}</pre><pre>${escapeHtml(tool.result || "")}</pre></details></div>`).join("")
      node.innerHTML = `<div class="who">${who}</div><div class="content">${renderText(text || "")}</div>${toolsHtml}`
      log.append(node)
      node.scrollIntoView({ block: "nearest" })
    }

    function setBusy(busy) {
      enviar.disabled = busy
      mensaje.disabled = busy
      let note = document.querySelector(".thinking")
      if (busy && !note) {
        note = document.createElement("p")
        note.className = "thinking"
        note.textContent = "Pensando…"
        log.append(note)
      }
      if (!busy && note) note.remove()
    }

    function setConfirmation(needed) {
      banner.hidden = !needed
    }

    async function send(text) {
      addBubble("user", text)
      mensaje.value = ""
      setBusy(true)
      setConfirmation(false)
      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sessionId, message: text }),
        })
        const data = await response.json()
        if (!response.ok) throw new Error(data.error || "No pude enviar el mensaje.")
        addBubble("assistant", data.reply || "", data.toolCalls || [])
        setConfirmation(data.needsConfirmation === true)
      } catch (error) {
        addBubble("assistant", error instanceof Error ? error.message : "Error de red. La sesión sigue activa.")
      } finally {
        setBusy(false)
        mensaje.focus()
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault()
      const text = mensaje.value.trim()
      if (text) send(text)
    })
    document.querySelector("#confirmar").addEventListener("click", () => send("confirmo"))
    document.querySelector("#nueva").addEventListener("click", () => {
      sessionId = crypto.randomUUID()
      localStorage.setItem("oc-session", sessionId)
      log.replaceChildren()
      setConfirmation(false)
    })
    for (const chip of document.querySelectorAll("[data-prompt]")) {
      chip.addEventListener("click", () => { mensaje.value = chip.getAttribute("data-prompt"); mensaje.focus() })
    }
    fetch("/api/health").then((response) => response.json()).then((data) => {
      health.textContent = data.ok ? `Servidor activo. Modelo: ${data.provider} / ${data.model}.` : "El servidor no respondió el chequeo."
    }).catch(() => { health.textContent = "No pude leer /api/health." })
    fetch(`/api/sessions/${sessionId}`).then((response) => response.json()).then((data) => {
      let pendingTools = []
      for (const message of data.messages || []) {
        if (message.role === "user") addBubble("user", message.content)
        if (message.role === "assistant" && message.toolCalls?.length) {
          pendingTools = message.toolCalls.map((call) => ({ name: call.name, arguments: call.arguments, summary: "Llamada registrada en la sesión.", result: "" }))
          if (message.content) {
            addBubble("assistant", message.content, pendingTools)
            pendingTools = []
          }
        } else if (message.role === "tool") {
          const slot = pendingTools.find((tool) => !tool.result)
          if (slot) slot.result = message.content
        } else if (message.role === "assistant" && message.content) {
          addBubble("assistant", message.content, pendingTools)
          pendingTools = []
        }
      }
      setConfirmation(data.pendingConfirmation === true)
    }).catch(() => {})
  </script>
</body>
</html>
